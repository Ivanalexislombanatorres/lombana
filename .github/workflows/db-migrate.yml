name: Migrar base de datos

# Aplica las migraciones pendientes a la base de producción (Supabase).
# Se ejecuta SOLO a mano: GitHub → Actions → "Migrar base de datos" → Run workflow.
# Las credenciales viven en los secretos del repositorio; nunca en el código ni en el chat.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe MIGRAR para confirmar'
        required: true

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'MIGRAR' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      LOMBANA_APP_DB_PASSWORD: ${{ secrets.LOMBANA_APP_DB_PASSWORD }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      APP_ENV: production
    steps:
      - name: Verificar secretos
        # Solo informa presencia y longitud; nunca imprime valores.
        run: |
          missing=0
          if [ -z "$DATABASE_ADMIN_URL" ]; then
            echo "::error title=Secreto faltante::DATABASE_ADMIN_URL no existe o está vacío"; missing=1
          else
            case "$DATABASE_ADMIN_URL" in
              postgres://*|postgresql://*) ;;
              *) echo "::error title=Formato::DATABASE_ADMIN_URL debe empezar por postgresql://"; missing=1 ;;
            esac
            case "$DATABASE_ADMIN_URL" in
              *YOUR-PASSWORD*) echo "::error title=Formato::DATABASE_ADMIN_URL aún contiene [YOUR-PASSWORD]"; missing=1 ;;
            esac
          fi
          if [ -z "$LOMBANA_APP_DB_PASSWORD" ]; then
            echo "::error title=Secreto faltante::LOMBANA_APP_DB_PASSWORD no existe o está vacío"; missing=1
          elif [ ${#LOMBANA_APP_DB_PASSWORD} -lt 20 ]; then
            echo "::error title=Contraseña corta::LOMBANA_APP_DB_PASSWORD tiene ${#LOMBANA_APP_DB_PASSWORD} caracteres; mínimo 20"; missing=1
          fi
          [ $missing -eq 0 ] && echo "::notice title=Secretos::Secretos presentes y con formato válido"
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Estado antes
        run: npm run db:status
      - name: Aplicar migraciones
        run: npm run db:migrate
      - name: Estado después
        run: npm run db:status
